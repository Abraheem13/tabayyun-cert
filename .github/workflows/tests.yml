name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy scipy pyyaml pandas matplotlib tqdm pytest
      - run: pytest -q
      - run: python experiments/e01_persistence.py --smoke
      - run: python experiments/e02_synthetic_defence.py --smoke
